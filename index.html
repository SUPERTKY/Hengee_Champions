<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <title>ヘンジーチャンピオンズ</title>
  <style>html, body { margin: 0; background: #000; }</style>
  <link rel="preload" as="image" href="assets/images/stage.png">
  <link rel="preload" as="image" href="assets/images/Title.png">
  <link rel="preload" as="image" href="assets/images/button.png">
  <link rel="stylesheet" href="styles.css">
  <script src="title.js" defer></script>
</head>
<body>
  <!-- Keep audio outside the screens so switching screens never stops it. -->
  <audio id="title-music" src="assets/sounds/Title.mp3" preload="auto" loop></audio>
  <audio id="title-ink" src="assets/sounds/Ink.mp3" preload="auto"></audio>
  <main id="title-screen" class="screen" tabindex="-1" hidden>
    <h1 tabindex="-1" hidden><img id="title-logo" src="assets/images/Title.png" alt="ヘンジーチャンピオンズ" decoding="async"></h1>
    <img id="menu-button-image" src="assets/images/button.png" alt="ボタン" decoding="async" hidden>
  </main>
  <div id="intro" class="screen">
    <img id="intro-icon" src="assets/images/Icon.png" alt="ヘンジーチャンピオンズ" decoding="async">
  </div>
  <button id="start" type="button" hidden>タップ・クリックして開始</button>
  <p id="error" role="alert" hidden></p>
  <noscript>このゲームを開始するには JavaScript を有効にしてください。</noscript>
</body>
</html>
